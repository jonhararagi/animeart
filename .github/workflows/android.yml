name: Android CI

concurrency:
  group: animeart-android-ci
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle assembleDebug
      - name: Verify APK bundles the current image editor
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q "assets/web/domain/image-processing.mjs"
          unzip -p "$APK" assets/web/index.html | grep -q 'id="crop-preview"'
          unzip -p "$APK" assets/web/index.html | grep -q 'id="add-text-layer"'
          unzip -p "$APK" assets/web/index.html | grep -q 'id="layer-adjustment-controls"'
          if unzip -p "$APK" assets/web/index.html | grep -qi "prompt studio"; then
            echo "Unexpected prompt-generator UI found in image editor APK" >&2
            exit 1
          fi
      - name: Unit tests
        run: gradle test
      - name: Lint
        run: gradle lintDebug
      - name: Android instrumentation and startup smoke tests
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          script: gradle connectedDebugAndroidTest && bash scripts/android-startup-smoke.sh
      - name: Prepare clearly versioned APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          VERSIONED_APK="AnimeArt-Android-aa-mobile-redesign-004-${GITHUB_SHA}.apk"
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$VERSIONED_APK"
          sha256sum "$VERSIONED_APK" | tee "$VERSIONED_APK.sha256"
          echo "Prepared APK: $VERSIONED_APK"
          ls -lh "$VERSIONED_APK" "$VERSIONED_APK.sha256"
      - name: Upload versioned Android APK
        uses: actions/upload-artifact@v7
        with:
          name: animeart-android-aa-mobile-redesign-004-${{ github.sha }}
          path: |
            AnimeArt-Android-aa-mobile-redesign-004-${{ github.sha }}.apk
            AnimeArt-Android-aa-mobile-redesign-004-${{ github.sha }}.apk.sha256
          if-no-files-found: error

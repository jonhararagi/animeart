name: Android CI

concurrency:
  group: animeart-android-ci
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle assembleDebug
      - name: Unit tests
        run: gradle test
      - name: Lint
        run: gradle lintDebug
      - name: Android startup smoke test
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          script: |
            adb wait-for-device
            for i in $(seq 1 120); do
              booted=$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$booted" = "1" ]; then
                break
              fi
              sleep 2
            done
            if [ "$booted" != "1" ]; then
              echo "El emulador no alcanzó sys.boot_completed=1. Diagnóstico:"
              adb devices -l || true
              adb logcat -d -t 500 || true
              exit 1
            fi
            test -f app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell input keyevent 82 || true
            adb logcat -c || true
            adb shell am force-stop com.jonhararagi.animeart
            set +e
            timeout 60s adb shell am start -W -n com.jonhararagi.animeart/.MainActivity
            start_status=$?
            set -e
            if [ "$start_status" -ne 0 ]; then
              echo "MainActivity no pudo iniciar dentro de 60 segundos (exit=$start_status). Logcat:"
              adb logcat -d -t 500 || true
              exit 1
            fi
            sleep 5
            pid=$(timeout 10s adb shell pidof com.jonhararagi.animeart | tr -d '\r')
            if ! printf '%s' "$pid" | grep -q '[0-9]'; then
              echo "MainActivity terminó inmediatamente después del arranque. Logcat:"
              adb logcat -d -t 500 || true
              exit 1
            fi
            adb shell am force-stop com.jonhararagi.animeart
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: animeart-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Android CI

concurrency:
  group: animeart-android-ci
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build
        run: gradle assembleDebug
      - name: Verify APK bundles the current image editor
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          INSPECT="$RUNNER_TEMP/animeart-apk-inspect"
          mkdir -p "$INSPECT"
          unzip -q "$APK" -d "$INSPECT"
          WEB="$INSPECT/assets/web"
          test -s app/src/main/res/drawable/ic_animeart_launcher.xml
          test -s app/src/main/res/xml/file_paths.xml
          test -s "$INSPECT/res/drawable/ic_animeart_launcher.xml"
          test -s "$INSPECT/res/xml/file_paths.xml"
          test -s "$WEB/icons/animeart-mark.svg"
          test -s "$WEB/domain/image-processing.mjs"
          test -s "$WEB/domain/creative-catalog.mjs"
          test -s "$WEB/domain/canvas-rendering.mjs"
          test -s "$WEB/domain/image-processing-client.mjs"
          test -s "$WEB/workers/image-processing-worker.mjs"
          grep -q 'id="creative-studio-dialog"' "$WEB/index.html"
          grep -q 'id="crop-preview"' "$WEB/index.html"
          grep -q 'id="add-text-layer"' "$WEB/index.html"
          grep -q 'id="layer-adjustment-controls"' "$WEB/index.html"
          grep -q 'id="open-apk-installer"' "$WEB/index.html"
          grep -q "MAX_IMAGES_PER_IMPORT_BATCH = 3" "$WEB/app.js"
          grep -q "openApkInstaller" "$WEB/app.js"
          grep -q "AA-CYBERPUNK-UI-002" "$WEB/styles.css"
          grep -q "AA-CYBERPUNK-UI-003" "$WEB/styles.css"
          grep -q "AA-A11Y-CONTRAST-001" "$WEB/styles.css"
          strings "$INSPECT/AndroidManifest.xml" > "$RUNNER_TEMP/animeart-manifest-strings.txt"
          grep -q "REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/animeart-manifest-strings.txt"
          grep -q "getAccentTextColor" "$WEB/appearance-settings.js"
          if grep -Eqi '<dialog[^>]*[[:space:]]id="(prompt-studio-dialog|prompt-generator-dialog)"' "$WEB/index.html"; then
            echo "Unexpected prompt-generator UI component found in image editor APK" >&2
            exit 1
          fi
      - name: Unit tests
        run: gradle test
      - name: Lint
        run: gradle lintDebug
      - name: Android instrumentation and startup smoke tests
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          script: gradle connectedDebugAndroidTest && bash scripts/android-startup-smoke.sh
      - name: Prepare clearly versioned APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          VERSIONED_APK="AnimeArt-Android-v0.3.0-${GITHUB_SHA}.apk"
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "$VERSIONED_APK"
          sha256sum "$VERSIONED_APK" | tee "$VERSIONED_APK.sha256"
          echo "Prepared APK: $VERSIONED_APK"
          ls -lh "$VERSIONED_APK" "$VERSIONED_APK.sha256"
      - name: Upload versioned Android APK
        uses: actions/upload-artifact@v7
        with:
          name: animeart-android-v0.3.0-${{ github.sha }}
          path: |
            AnimeArt-Android-v0.3.0-${{ github.sha }}.apk
            AnimeArt-Android-v0.3.0-${{ github.sha }}.apk.sha256
          if-no-files-found: error

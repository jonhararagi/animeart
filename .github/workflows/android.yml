name: Android CI

concurrency:
  group: animeart-android-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Configure stable APK signing (optional but required for repeatable updates)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          ANIMEART_KEYSTORE_BASE64: ${{ secrets.ANIMEART_KEYSTORE_BASE64 }}
          ANIMEART_KEYSTORE_PASSWORD_INPUT: ${{ secrets.ANIMEART_KEYSTORE_PASSWORD }}
          ANIMEART_KEY_ALIAS_INPUT: ${{ secrets.ANIMEART_KEY_ALIAS }}
          ANIMEART_KEY_PASSWORD_INPUT: ${{ secrets.ANIMEART_KEY_PASSWORD }}
          ANIMEART_EXPECTED_CERT_SHA256_INPUT: ${{ vars.ANIMEART_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          present=0
          for value in "$ANIMEART_KEYSTORE_BASE64" "$ANIMEART_KEYSTORE_PASSWORD_INPUT" "$ANIMEART_KEY_ALIAS_INPUT" "$ANIMEART_KEY_PASSWORD_INPUT"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 0 ]]; then
            echo "ANIMEART_SIGNING_MODE=ephemeral-debug" >> "$GITHUB_ENV"
            {
              echo "### APK signing warning"
              echo "Stable signing secrets are not configured. This CI APK uses the runner-generated debug certificate; updating an installation signed with another certificate is not guaranteed."
              echo "Configure the four signing secrets as documented in docs/ANDROID_SIGNING.md."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Stable APK signing secrets are missing; update compatibility is not guaranteed."
          elif [[ "$present" -ne 4 ]]; then
            echo "::error::Stable APK signing is only partially configured. Set all four signing secrets or remove them all."
            exit 1
          else
            KEYSTORE_PATH="$RUNNER_TEMP/animeart-signing.jks"
            printf '%s' "$ANIMEART_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            {
              echo "ANIMEART_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ANIMEART_KEYSTORE_PASSWORD=$ANIMEART_KEYSTORE_PASSWORD_INPUT"
              echo "ANIMEART_KEY_ALIAS=$ANIMEART_KEY_ALIAS_INPUT"
              echo "ANIMEART_KEY_PASSWORD=$ANIMEART_KEY_PASSWORD_INPUT"
              echo "ANIMEART_SIGNING_MODE=stable"
              if [[ -n "$ANIMEART_EXPECTED_CERT_SHA256_INPUT" ]]; then
                echo "ANIMEART_EXPECTED_CERT_SHA256=$ANIMEART_EXPECTED_CERT_SHA256_INPUT"
              fi
            } >> "$GITHUB_ENV"
            echo "Stable APK signing configured from GitHub Actions secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: gradle assembleDebug
      - name: Verify APK bundles the current image editor
        shell: bash
        run: |
          set -euxo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          INSPECT="$RUNNER_TEMP/animeart-apk-inspect"
          mkdir -p "$INSPECT"
          unzip -q "$APK" -d "$INSPECT"
          WEB="$INSPECT/assets/web"
          test -s app/src/main/res/drawable/ic_animeart_launcher.xml
          test -s app/src/main/res/xml/file_paths.xml
          test -s "$INSPECT/res/drawable/ic_animeart_launcher.xml"
          test -s "$INSPECT/res/xml/file_paths.xml"
          test -s "$WEB/icons/animeart-mark.svg"
          test -s "$WEB/domain/image-processing.mjs"
          test -s "$WEB/domain/creative-catalog.mjs"
          test -s "$WEB/domain/design-alignment.mjs"
          test -s "$WEB/domain/design-library.mjs"
          test -s "$WEB/domain/multi-page-project.mjs"
          test -s "$WEB/domain/anime-style-library.mjs"
          test -s "$WEB/domain/anime-character-presets.mjs"
          test -s "$WEB/domain/canvas-rendering.mjs"
          test -s "$WEB/domain/stroke-smoothing.mjs"
          test -s "$WEB/domain/freehand-rendering.mjs"
          test -s "$WEB/domain/image-processing-client.mjs"
          test -s "$WEB/domain/anime-color-studio.mjs"
          grep -q 'id="recolor-wand-toggle"' "$WEB/index.html"
          grep -q 'id="anime-color-search"' "$WEB/index.html"
          grep -q 'id="recolor-split-layer"' "$WEB/index.html"
          grep -q 'id="recolor-rectangle-toggle"' "$WEB/index.html"
          grep -q 'id="recolor-effect-layer"' "$WEB/index.html"
          grep -q 'id="erase-color-effect"' "$WEB/index.html"
          grep -q 'id="recolor-temperature"' "$WEB/index.html"
          grep -q 'id="recolor-darkness"' "$WEB/index.html"
          grep -q "animeart-web-shell-v73" "$WEB/service-worker.js"
          grep -q 'id="design-library-dialog"' "$WEB/index.html"
          grep -q 'id="multi-page-dialog"' "$WEB/index.html"
          grep -q 'id="quick-open-page-manager"' "$WEB/index.html"
          grep -q 'id="multi-page-copy-layer"' "$WEB/index.html"
          grep -q 'id="quick-open-design-library"' "$WEB/index.html"
          grep -q 'data-layer-align="distribute-horizontal"' "$WEB/index.html"
          test -s "$WEB/workers/image-processing-worker.mjs"
          grep -q 'id="creative-studio-dialog"' "$WEB/index.html"
          grep -q 'id="creative-trait-create-character"' "$WEB/index.html"
          grep -q 'id="creative-character-set-save"' "$WEB/index.html"
          grep -q 'id="creative-character-palette-save"' "$WEB/index.html"
          grep -q 'id="creative-trait-hair-color"' "$WEB/index.html"
          grep -q 'function createAnimeCharacterFromSelectedTraits' "$WEB/app.js"
          grep -q 'export function createAnimeCharacterParts' "$WEB/domain/anime-style-library.mjs"
          grep -q 'id="guided-editing-dialog"' "$WEB/index.html"
          test -s "$WEB/domain/guided-editing.mjs"
          test -s "$WEB/assets/kapiart-mascot.png"
          grep -q 'value="cyberpunk-neon"' "$WEB/index.html"
          grep -q 'value="photo-improve"' "$WEB/index.html"
          grep -q 'id="crop-preview"' "$WEB/index.html"
          grep -q 'id="add-text-layer"' "$WEB/index.html"
          grep -q 'id="layer-adjustment-controls"' "$WEB/index.html"
          grep -q 'id="open-apk-installer"' "$WEB/index.html"
          grep -q "MAX_IMAGES_PER_IMPORT_BATCH = 3" "$WEB/app.js"
          grep -q "openApkInstaller" "$WEB/app.js"
          grep -q "AA-CYBERPUNK-UI-002" "$WEB/styles.css"
          grep -q "AA-CYBERPUNK-UI-003" "$WEB/styles.css"
          grep -q "AA-A11Y-CONTRAST-001" "$WEB/styles.css"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/animeart-manifest-permissions.txt"
          grep -q "android.permission.REQUEST_INSTALL_PACKAGES" "$RUNNER_TEMP/animeart-manifest-permissions.txt"
          grep -q "getAccentTextColor" "$WEB/appearance-settings.js"
          if grep -Eqi '<dialog[^>]*[[:space:]]id="(prompt-studio-dialog|prompt-generator-dialog)"' "$WEB/index.html"; then
            echo "Unexpected prompt-generator UI component found in image editor APK" >&2
            exit 1
          fi
      - name: Unit tests
        run: gradle test
      - name: Lint
        run: gradle lintDebug
      - name: Android instrumentation and startup smoke tests
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -noaudio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect
          script: gradle connectedDebugAndroidTest && bash scripts/android-startup-smoke.sh
      - name: Prepare, verify, and checksum APK
        id: apk_metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+)[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ || ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read a valid versionCode/versionName from app/build.gradle.kts."
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          VERSIONED_APK="KapiArt-Android-v${VERSION_NAME}-${GITHUB_SHA}.apk"
          test -s "$SOURCE_APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$AAPT"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$SOURCE_APK" > "$RUNNER_TEMP/animeart-apk-signature.txt" 2>&1
          "$AAPT" dump badging "$SOURCE_APK" > "$RUNNER_TEMP/animeart-apk-badging.txt"
          grep -F "package: name='com.jonhararagi.animeart' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" "$RUNNER_TEMP/animeart-apk-badging.txt"
          CERT_SHA256="$(awk '
            {
              lower=tolower($0)
              marker="sha-256 digest:"
              position=index(lower, marker)
              if (position > 0) {
                digest=substr($0, position + length(marker))
                gsub(/[^[:xdigit:]]/, "", digest)
                if (length(digest) >= 64) {
                  print tolower(substr(digest, 1, 64))
                  exit
                }
              }
            }
          ' "$RUNNER_TEMP/animeart-apk-signature.txt")"
          if [[ ! "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            cat "$RUNNER_TEMP/animeart-apk-signature.txt"
            echo "::error::Could not extract a 64-character SHA-256 certificate fingerprint from apksigner output."
            exit 1
          fi
          if [[ -n "${ANIMEART_EXPECTED_CERT_SHA256:-}" ]]; then
            EXPECTED_CERT_SHA256="$(printf '%s' "$ANIMEART_EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            ACTUAL_CERT_SHA256="$(printf '%s' "$CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [[ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]]; then
              echo "::error::APK signer certificate does not match ANIMEART_EXPECTED_CERT_SHA256."
              exit 1
            fi
          fi
          cp "$SOURCE_APK" "$VERSIONED_APK"
          sha256sum "$VERSIONED_APK" > "$VERSIONED_APK.sha256"
          sha256sum --check "$VERSIONED_APK.sha256"
          SIGNING_REPORT="${VERSIONED_APK%.apk}.signing.txt"
          {
            echo "application_id=com.jonhararagi.animeart"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
            echo "source_sha=$GITHUB_SHA"
            echo "signing_mode=${ANIMEART_SIGNING_MODE:-ephemeral-debug}"
            echo "signer_certificate_sha256=$CERT_SHA256"
            if [[ "${ANIMEART_SIGNING_MODE:-ephemeral-debug}" == "stable" ]]; then
              echo "update_compatibility=stable key configured; compare certificate fingerprint with the installed APK"
            else
              echo "update_compatibility=NOT GUARANTEED; runner-generated debug key is not stable between clean runners"
            fi
          } > "$SIGNING_REPORT"
          echo "Prepared APK: $VERSIONED_APK"
          cat "$SIGNING_REPORT"
          ls -lh "$VERSIONED_APK" "$VERSIONED_APK.sha256" "$SIGNING_REPORT"
      - name: Upload versioned Android APK
        uses: actions/upload-artifact@v7
        with:
          name: kapiart-android-debug-v${{ steps.apk_metadata.outputs.version_name }}-${{ github.sha }}
          path: |
            KapiArt-Android-v${{ steps.apk_metadata.outputs.version_name }}-${{ github.sha }}.apk
            KapiArt-Android-v${{ steps.apk_metadata.outputs.version_name }}-${{ github.sha }}.apk.sha256
            KapiArt-Android-v${{ steps.apk_metadata.outputs.version_name }}-${{ github.sha }}.signing.txt
          if-no-files-found: error

name: Web CI

concurrency:
  group: animeart-web-ci
  cancel-in-progress: true

on:
  push:
    branches: ["main", "aa-mobile-redesign-004"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify build output
        run: test -f dist/index.html
      - name: Upload downloadable Web editor build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: animeart-web-editor-build
          path: web/dist/
          if-no-files-found: error
          retention-days: 30

      - name: Real browser E2E
        run: |
          CHROME_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)" node scripts/browser-e2e.mjs

      - name: Upload real-browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animeart-studio-browser-captures
          path: web/dist/e2e-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

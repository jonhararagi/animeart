name: Web CI

concurrency:
  group: animeart-web-ci
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Verify build output
        run: test -f dist/index.html
      - name: Real browser E2E
        run: |
          CHROME_BIN="$(command -v chromium || command -v google-chrome || command -v google-chrome-stable)" node test/browser-e2e.mjs

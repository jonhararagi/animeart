name: Deploy AnimeArt Web

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: animeart-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: web
        run: npm test
      - name: Build static editor
        working-directory: web
        run: npm run build
      - name: Configure GitHub Pages
        if: vars.ENABLE_GITHUB_PAGES_DEPLOY == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload downloadable editor build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: animeart-web-editor-build
          path: web/dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        if: vars.ENABLE_GITHUB_PAGES_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: vars.ENABLE_GITHUB_PAGES_DEPLOY == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
